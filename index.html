<title>Великие женщины — Коллекция историй</title>
<style>
:root{
  --dark:#17120f;--wood:#241b16;--paper:#eee0bf;--cream:#fff1d3;--gold:#dcbd82;--line:rgba(246,216,162,.28);
  --pale:#c7af8a;--green:#a5d5a6;--red:#e7a2a0;--serif:Georgia,'Times New Roman',serif;
  --app-vh: 100dvh;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#110e0c;color:#fff0d5;font-family:Arial,Helvetica,sans-serif;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
button,input{font:inherit}button{color:inherit;cursor:pointer;touch-action:manipulation}button:disabled{cursor:not-allowed;opacity:.42}button:focus-visible,input:focus-visible{outline:3px solid #ffe9a9;outline-offset:4px}
#app{position:relative;isolation:isolate;width:100%;height:100vh;height:var(--app-vh);min-height:500px;overflow:hidden;background:radial-gradient(ellipse at 49% 24%,#554131 0%,#2b211c 40%,#15120f 85%)}
#app:before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 115px),linear-gradient(180deg,rgba(14,11,9,.65),transparent 45%,rgba(10,8,7,.7)),radial-gradient(ellipse at 50% 35%,rgba(230,174,93,.11),transparent 55%)}
#app:after{content:'';position:absolute;inset:11px;border:1px solid rgba(238,203,148,.17);border-radius:20px;pointer-events:none;z-index:3}
#app .frame-decoration{position:absolute;pointer-events:none;top:10%;bottom:0;width:26%;opacity:.20;background:repeating-linear-gradient(0deg,rgba(8,6,5,.83) 0 15px,rgba(156,106,61,.29) 17px 19px,rgba(54,36,24,.25) 20px 72px);filter:blur(1px)}
#app .frame-decoration.left{left:0;mask-image:linear-gradient(90deg,#000,transparent)}#app .frame-decoration.right{right:0;mask-image:linear-gradient(270deg,#000,transparent)}
header{position:absolute;z-index:16;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px clamp(18px,3.4vw,52px);background:linear-gradient(180deg,rgba(12,9,8,.8),transparent)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brandSeal{width:42px;height:42px;display:grid;place-items:center;border:1px solid #ab8652;border-radius:50%;background:#31251c;color:#f5d5a0;font:28px var(--serif);flex:none}.brandText{font:normal clamp(21px,2.1vw,28px)/1.1 var(--serif);white-space:nowrap}.brandSub{font-size:10px;letter-spacing:.18em;color:#bfa77f;text-transform:uppercase;margin-top:4px}
.toolbar{display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.small{border:1px solid var(--line);border-radius:11px;background:rgba(38,29,23,.84);padding:10px 12px;font-size:13px;font-weight:600;white-space:nowrap}.small.restart{color:#f6cebd;border-color:rgba(243,169,151,.37)}
.btn{border:1px solid rgba(255,238,192,.55);border-radius:13px;background:linear-gradient(180deg,#eed4a3,#c79d64);box-shadow:0 12px 30px #08060470,inset 0 1px 0 #fff5ce99;color:#261a11;font-weight:750;font-size:clamp(17px,1.8vw,24px);padding:14px 27px;min-height:52px}.btn.secondary{background:rgba(52,39,29,.84);color:#f6e5c4;border-color:#b58d57}.btn.tertiary{background:transparent;color:#e0c59c;border-color:#775937}
.view{position:relative;z-index:5;width:100%;height:100%;padding:88px clamp(20px,3.3vw,55px) 25px;display:flex;align-items:center;justify-content:center}
.intro{max-height:calc(var(--app-vh) - 120px);width:min(860px,96%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(23px,4vw,48px);border:1px solid rgba(235,195,133,.5);border-radius:25px;background:radial-gradient(ellipse at top,rgba(166,112,58,.23),transparent 65%),linear-gradient(180deg,rgba(40,29,23,.94),rgba(25,19,16,.97));box-shadow:0 28px 95px rgba(0,0,0,.6),inset 0 0 58px rgba(161,109,54,.1)}
.ornament{letter-spacing:.24em;text-transform:uppercase;font-size:clamp(12px,1.4vw,16px);color:var(--gold);font-weight:bold}.intro h1{font:normal clamp(43px,5.1vw,74px)/1.07 var(--serif);margin:12px 0;color:#fff0d4;letter-spacing:.012em}.intro p{max-width:700px;font-size:clamp(17px,1.8vw,24px);line-height:1.42;color:#decbb0;margin:0 0 18px}
.timeInputs{display:flex;justify-content:center;align-items:center;gap:15px;margin:13px 0 7px;flex-wrap:wrap}.inputUnit{display:flex;align-items:center;gap:10px;border:1px solid #99784e;border-radius:13px;padding:10px 16px;background:rgba(15,12,10,.62)}.inputUnit input{font:normal 40px var(--serif);color:#ffefd0;border:0;background:none;width:75px;text-align:center;appearance:textfield;-moz-appearance:textfield}.inputUnit input::-webkit-outer-spin-button,.inputUnit input::-webkit-inner-spin-button{-webkit-appearance:none}.inputUnit span{font-size:18px;color:#ddc6a0}.intro .tip{font-size:13px;color:#af9c80;margin-top:13px}
.heroCard{width:min(1140px,98%);height:min(645px,calc(var(--app-vh) - 120px));min-height:425px;display:grid;grid-template-columns:41% 59%;background:linear-gradient(125deg,#d4c19b,#f2e5c5 49%,#e0cfaa);border:8px solid #4a3324;outline:2px solid #c7a16a;border-radius:18px;overflow:hidden;box-shadow:0 25px 90px #090606ad,inset 0 0 18px #7f59263b;color:#34251a}
.portraitArea{position:relative;min-width:0;padding:20px;background:linear-gradient(125deg,#3a332b,#766147 45%,#332b25);display:flex;align-items:center;justify-content:center;overflow:hidden;border-right:7px solid #a78a5f}
.portraitArea:before{content:'';position:absolute;inset:10px;border:1px solid #f9dfac88;pointer-events:none}.portraitArea img{width:100%;height:100%;object-fit:cover;object-position:center;border:9px solid rgba(235,217,171,.56);box-shadow:0 10px 34px #0009;filter:sepia(.06)}.portraitBadge{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);padding:9px 13px;background:rgba(33,25,22,.85);border:1px solid #d6b485;color:#f3dec0;font-size:12px;letter-spacing:.02em;white-space:nowrap}
.bioArea{display:flex;flex-direction:column;gap:clamp(7px,1.4vh,12px);padding:clamp(17px,3vw,33px);min-width:0;min-height:0;position:relative}
.bioArea:before{content:'✦';position:absolute;right:30px;top:18px;color:#a38b62;font-size:23px}.bioHeadLabel{color:#8d6847;letter-spacing:.19em;text-transform:uppercase;font-size:13px;font-weight:750}.personTitle{font:normal clamp(28px,3.2vw,48px)/1.02 var(--serif);margin:0;color:#402d21;text-wrap:balance}.years{font:normal clamp(15px,1.5vw,20px) var(--serif);color:#6f513b}.description{font:normal clamp(17px,1.75vw,23px)/1.32 var(--serif);color:#453628;overflow-wrap:anywhere}.factLine{font-size:clamp(14px,1.35vw,18px);line-height:1.28;background:rgba(114,80,49,.1);border-left:4px solid #a7804d;padding:11px 15px;color:#5b4030}.bioSpacer{flex:1;min-height:0}
.timeResult{border:1px solid #b7986e;border-radius:12px;background:#f8e9c6b0;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;gap:14px}.timeCount{font:normal clamp(35px,4.7vw,66px)/1 var(--serif);color:#452b1d;white-space:nowrap}.timeCount span{font-size:18px}.timeDescription{font-size:clamp(13px,1.4vw,17px);color:#533b2a;line-height:1.3}.timeDescription strong{color:#55351b}.timeDescription .bonus{color:#27603d;font-weight:bold}.timeDescription .penalty{color:#922b2d;font-weight:bold}
.bottomButtons{display:flex;justify-content:flex-start;align-items:center;gap:13px;flex-wrap:wrap}.bottomButtons .btn{font-size:clamp(16px,1.7vw,22px);padding:10px 21px;min-height:47px}
.board{width:min(1120px,100%);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,19px)}.boardTitle{font:normal clamp(33px,3.4vw,52px)/1.02 var(--serif);color:#f4dcae;margin:0;text-align:center}.boardHint{font-size:clamp(13px,1.35vw,18px);color:#d0b89b;text-align:center}.boardStats{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}.stat{padding:7px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(22,16,13,.65);text-align:center;min-width:120px}.stat span{font-size:11px;color:#ceb48a;text-transform:uppercase;letter-spacing:.1em}.stat b{font:normal 26px var(--serif);display:block;margin-top:1px}
.cardsGrid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(7px,1.2vh,13px);height:min(63vh,590px);width:min(510px,55vw);min-height:0;align-content:center;justify-items:center}.closedCard,.openedCard{height:100%;width:100%;min-height:0;aspect-ratio:.68;border-radius:8px;padding:0;border:4px solid #8a6a42;outline:1px solid #ddbe86;box-shadow:0 6px 13px #0009;overflow:hidden;position:relative;background:#5b4431;transition:transform .15s,border-color .15s}.closedCard{background-image:linear-gradient(0deg,rgba(33,20,14,.12),rgba(49,29,13,.03)),url(data:image/webp;base64,UklGRkjdAABXRUJQVlA4IDzdAABQIQOdASoGAlIDPm0ylUgkIqSrpbKLmXANiWdojaWH+8o9oMMhl747e6vb+zNp2isQjre24oyTfsf01P+l3Gu23sAcZPNM9BefT5Gv1lYv6+QdfAmY9a/9elHkQ9WYO3+3m0//ns2/fHUT0ecLL/Jv2h/Jn3pfJf6v/Qflp/iPUf8o+1/1X+H/cX/D+nN5sfZ/8r/x/7T1N/m34l/Z/3793/8j8D/9z/W+V/zf/0vzb/2fyEfk/8//z392/db/EfHv+Z3ze7f8z/2eod7f/YP9x/jv9V/8/8h6qP/R6d/bD/uf6D8nPsB/pP9q/5X3TfSX/V8cb2v2Bf6p/mf28913/I/+H+w/237ue879B/23/o/0n+u+Qr+cf2//nf4r/TftYXiivCIsYGsuyEOhu6z7N3akNksDUoGUCx72Q8qFNPagFdKoMP5/vNhCnmeLQYdPnHRxNAch7jbhyKPaGGhOf4ZsQb0JTiSJgoy3WZFah5ogouAZodh+L4FGRzyqatA0UqGGOT3ctZfgCwPSKs2Bfr7j1N4O/hbvpzXj85tM2Z6uswDSpi4dNZS0pyw6nNvLEjdmgiySm0Y8MMVvkKFY8yL4AQ8v3BskDYNijqBlkM803oc3qiIlDFvKLdBhB+UrnHkpJm0jflSkVVZ+nHPQ72weVEL8ya4cITNpdFMFrt6Yap2o3NnDdkzgYjHa2VHbFcFtfuNikFOJFEIFBQZUoSpo4a3ZO2Du2HJsipaKMp61wJjqYID1kzGa3BKmoGzKV6vpLEndflExYmVDF56/Y5rkUMT3jCtiYhX1zt87fuhfUcV/GY/L6QAnKrbQOo/BVvAmMr6e/glcrA0Sf6a5Il8pMjGrqszyhX4xhGUboSqLW4ebDF+yrloOyyLLPJkwt9roAWnrfE6OL8r2Ps2diIXXufk7N+LY26KOpBMdRtRUZ9tpUoHxj3pc6NvroZe/r/Qoq1srAKFwugtCvT3NnbJN2NDjM2fZaI6bddb9u/jZvKw51kHGuXue2RaXf5vLwPLfyVOK76KqjiFc4XQy/FsM6OOFU3nRi8j0qt6R5pdCgOGhcjajH+2WHoI0h9dVWzZ5JtVoT+tsX83o0sDQpF/uEcvYUeZE3xSQVoHXqMyG3xYEM3CBZH+5RxJM74cR9o+yh++c7Ioi3SAsYjQ2mEDqsB/FCdK38AetrRP3edoFt84O+8D7Z9O27Hx3KRirH3Az89C62E384pJCiAwMOxsLzroFQx7Vyyy8B1CxKe4vrGkOTXn0uV4RjYWPnkxTT0HaCehNbysJ0EP+tOm4bGtNlKBB1gcbMCXK3YwkDTEdXeGj7G3RsWaZ15pY7OiZqP .openedCard{background:#f4e8c9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3a281e;padding:5px;text-align:center;border-color:#c7a16a;cursor:default}.openedCard img{width:100%;height:60%;object-fit:cover;border-radius:3px;margin-bottom:5px;filter:sepia(.2)}.openedCard span{font-size:clamp(8px,1vw,11px);font-weight:bold;line-height:1.1;font-family:var(--serif)}
@media(max-width:760px){
 header{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:6px}.brandSeal{width:32px;height:32px;font:22px var(--serif)}.brandText{font-size:16px}.brandSub{display:none}
 .view{padding-top:64px;padding-bottom:15px}
 .heroCard{grid-template-columns:1fr;grid-template-rows:35% 65%;border-width:5px}
 .portraitArea{border-right:none;border-bottom:5px solid #a78a5f;padding:12px}
 .portraitArea img{border-width:5px}
 .bioArea{padding:12px;gap:5px}.bioArea:before{display:none}.personTitle{font-size:22px}.description{font-size:14px;line-height:1.25;margin:0}.factLine{font-size:11px;padding:6px 9px;margin-top:2px}.timeResult{padding:6px 10px;margin-top:2px}.timeCount{font-size:28px}.timeDescription{font-size:11px}
 .bottomButtons{justify-content:center;gap:8px}.bottomButtons .btn{padding:8px 12px;font-size:14px;min-height:38px}
 .cardsGrid{grid-template-columns:repeat(4,1fr);width:100%;height:55vh;gap:5px}.closedCard,.openedCard{border-width:2px}.openedCard img{height:50%}.openedCard span{font-size:7px}
 .boardTitle{font-size:26px}.boardHint{font-size:12px}.boardStats{gap:6px}.stat{padding:4px 8px;min-width:90px}.stat span{font-size:9px}.stat b{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="frame-decoration left"></div><div class="frame-decoration right"></div>
  <header>
    <div class="brand"><div class="brandSeal">❦</div><div><div class="brandText">Великие женщины</div><div class="brandSub">Коллекция историй</div></div></div>
    <div class="toolbar" id="headerTools"></div>
  </header>
  
  <div class="view" id="viewContainer"></div>
</div>

<script>
const womenData = [
  {name:"Клеопатра", years:"69–30 до н.э.", desc:"Последняя царица Египта из династии Птолемеев. Известна своим умом, образованием и политическим влиянием на Рим.", fact:"Владела несколькими языками и была автором научных трудов.", time:3},
  {name:"Жанна д’Арк", years:"1412–1431", desc:"Национальная героиня Франции, одна из главнокомандующих французскими войсками в Столетней войне.", fact:"Канонизирована как святая католической церковью.", time:4},
  {name:"Изабелла I", years:"1451–1504", desc:"Королева Кастилии и Леона. Её брак с Фердинандом Арагонским привёл к объединению Испании.", fact:"Финансировала экспедицию Христофора Колумба.", time:5},
  {name:"Елизавета I", years:"1533–1603", desc:"Королева Англии и Ирландии, последняя из династии Тюдоров. Период её правления называют «золотым веком».", fact:"Никогда не вышла замуж и получила прозвище «Королева-девственница».", time:5},
  {name:"Мария Кюри", years:"1867–1934", desc:"Физик и химик, первая женщина-профессор Сорбонны. Единственная женщина, получившая Нобелевскую премию в двух разных науках.", fact:"Открыла полоний и радий.", time:6},
  {name:"Кэтрин Джонсон", years:"1918–2020", desc:"Математик, внёсшая вклад в аэрокосмическую программу США. Рассчитывала траектории полётов.", fact:"Её вычисления помогли успешно приземлить Аполлон-11 на Луну.", time:4},
  {name:"Ада Лавлейс", years:"1815–1852", desc:"Математик, известная созданием описания вычислительной машины Чарльза Бэббиджа.", fact:"Считается первым программистом в истории.", time:3},
  {name:"Фрида Кало", years:"1907–1954", desc:"Мексиканская художница, известная своими яркими и глубоко личными автопортретами.", fact:"В детстве перенесла полиомиелит, а позже серьёзную аварию.", time:4},
  {name:"Агата Кристи", years:"1890–1976", desc:"Английская писательница, автор детективной прозы. Самый публикуемый писатель всех времён.", fact:"Её пьеса «Мышеловка» идёт в Лондоне с 1952 года.", time:3},
  {name:"Малала Юсуфзай", years:"1997–", desc:"Пакистанская правозащитница, выступающая за доступность образования для девочек.", fact:"Самая молодая лауреат Нобелевской премии в истории.", time:2},
  {name:"Валентина Терешкова", years:"1937–", desc:"Первая в мире женщина-космонавт. Совершила полёт на корабле «Восток-6» в 1963 году.", fact:"Провела на орбите почти 3 суток.", time:3},
  {name:"Индира Ганди", years:"1917–1984", desc:"Первая женщина-премьер-министр Индии. Занимала этот пост с перерывами в течение 15 лет.", fact:"Была дочерью Джавахарлала Неру.", time:4},
  {name:"Маргарет Тэтчер", years:"1925–2013", desc:"Первая женщина-премьер-министр Великобритании. Известна как «Железная леди».", fact:"Провела на посту 11 лет, дольше всех в XX веке.", time:5},
  {name:"Мать Тереза", years:"1910–1997", desc:"Католическая монахиня, основательница Ордена милосердия в Калькутте.", fact:"Лауреат Нобелевской премии мира.", time:3},
  {name:"Хатшепсут", years:"1507–1458 до н.э.", desc:"Женщина-фараон Древнего Египта, правившая более 20 лет.", fact:"Организовала знаменитую экспедицию в страну Пунт.", time:4},
  {name:"Мэри Эннинг", years:"1799–1847", desc:"Британская палеонтолог-любитель, известная находками окаменелостей на побережье.", fact:"Нашла первого полного ихтиозавра.", time:3}
];

let state = {
  phase: 'intro',
  timeLeft: 0,
  initialTime: 0,
  opened: [],
  currentCard: null
};

const $ = id => document.getElementById(id);
const view = $('viewContainer');
const tools = $('headerTools');

function save() {
  try { localStorage.setItem('women_game_state', JSON.stringify(state)); } catch(e){}
}
function load() {
  try {
    const s = localStorage.getItem('women_game_state');
    if(s) {
      const parsed = JSON.parse(s);
      if(parsed && parsed.phase) state = parsed;
    }
  } catch(e){}
}

function updateTools() {
  tools.innerHTML = '';
  if(state.phase === 'intro') {
    tools.innerHTML = `<button class="small" onclick="startGame(20)">20 мин</button>
                       <button class="small" onclick="startGame(30)">30 мин</button>
                       <button class="small" onclick="startGame(45)">45 мин</button>`;
  } else {
    tools.innerHTML = `<div class="small" style="border-color:#d4b880;color:#ffe9b0;">⏳ ${state.timeLeft} мин</div>
                       <button class="small restart" onclick="restartGame()">Заново</button>`;
  }
}

function render() {
  updateTools();
  view.innerHTML = '';
  
  if(state.phase === 'intro') {
    view.innerHTML = `
      <div class="intro">
        <div class="ornament">Оливковое издание</div>
        <h1>Великие женщины</h1>
        <p>Откройте карточки и прочитайте истории женщин, изменивших мир. Каждая карточка отнимает время из вашего лимита.</p>
        <div class="timeInputs">
          <div class="inputUnit">
            <input type="number" id="timeInput" value="30" min="1" max="99">
            <span>минут на игру</span>
          </div>
        </div>
        <button class="btn" onclick="startGame(parseInt(document.getElementById('timeInput').value) || 30)">Начать</button>
        <div class="tip">* Время списывается за каждую прочитанную биографию.</div>
      </div>
    `;
    return;
  }
  
  if(state.phase === 'board') {
    const openedSet = new Set(state.opened);
    let gridHtml = '';
    womenData.forEach((w, i) => {
      if(openedSet.has(i)) {
        gridHtml += `<div class="openedCard"><img src="https://ui-avatars.com/api/?name=${encodeURIComponent(w.name)}&background=eed4a3&color=261a11&size=100" alt="${w.name}"><span>${w.name}</span></div>`;
      } else {
        gridHtml += `<button class="closedCard" onclick="openCard(${i})"></button>`;
      }
    });
    
    view.innerHTML = `
      <div class="board">
        <h2 class="boardTitle">Выберите карточку</h2>
        <div class="boardHint">Каждое открытие отнимет указанное время</div>
        <div class="cardsGrid">${gridHtml}</div>
        <div class="boardStats">
          <div class="stat"><span>Открыто</span><b>${state.opened.length} / 16</b></div>
        </div>
      </div>
    `;
    return;
  }
  
  if(state.phase === 'card') {
    const w = womenData[state.currentCard];
    view.innerHTML = `
      <div class="heroCard">
        <div class="portraitArea">
          <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(w.name)}&background=eed4a3&color=261a11&size=400" alt="${w.name}">
          <div class="portraitBadge">${w.years}</div>
        </div>
        <div class="bioArea">
          <div class="bioHeadLabel">История</div>
          <h2 class="personTitle">${w.name}</h2>
          <div class="description">${w.desc}</div>
          <div class="factLine">${w.fact}</div>
          <div class="bioSpacer"></div>
          <div class="timeResult">
            <div class="timeCount">${w.time} <span>мин</span></div>
            <div class="timeDescription">Списано за <strong>${w.name}</strong></div>
          </div>
          <div class="bottomButtons">
            <button class="btn secondary" onclick="closeCard()">← Назад к карточкам</button>
          </div>
        </div>
      </div>
    `;
    return;
  }
  
  if(state.phase === 'gameover') {
    view.innerHTML = `
      <div class="board">
        <h2 class="boardTitle">Время вышло!</h2>
        <div class="boardHint">Вы открыли ${state.opened.length} из 16 историй</div>
        <div class="cardsGrid">
          ${womenData.map((w, i) => `<div class="openedCard"><img src="https://ui-avatars.com/api/?name=${encodeURIComponent(w.name)}&background=eed4a3&color=261a11&size=100" alt="${w.name}"><span>${w.name}</span></div>`).join('')}
        </div>
        <button class="btn" onclick="restartGame()" style="margin-top:10px;">Сыграть ещё</button>
      </div>
    `;
    return;
  }
}

function startGame(minutes) {
  state.phase = 'board';
  state.initialTime = minutes;
  state.timeLeft = minutes;
  state.opened = [];
  state.currentCard = null;
  save();
  render();
}

function openCard(index) {
  if(state.timeLeft <= 0) return;
  const cost = womenData[index].time;
  if(state.timeLeft - cost < 0) {
    alert("Недостаточно времени! Вы не можете прочитать эту историю.");
    return;
  }
  
  state.currentCard = index;
  if(!state.opened.includes(index)) {
    state.opened.push(index);
    state.timeLeft -= cost;
  }
  state.phase = 'card';
  save();
  render();
}

function closeCard() {
  if(state.timeLeft <= 0) {
    state.phase = 'gameover';
  } else {
    state.phase = 'board';
  }
  save();
  render();
}

function restartGame() {
  state = { phase: 'intro', timeLeft: 0, initialTime: 0, opened: [], currentCard: null };
  save();
  render();
}

load();
if(state.phase !== 'intro' && state.timeLeft <= 0) state.phase = 'gameover';
render();

// Регистрация Service Worker для работы офлайн
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

// Фикс для старых iPad (100dvh)
if(!window.CSS || !CSS.supports || !CSS.supports('height','100dvh')){
  const setVH=()=>document.documentElement.style.setProperty('--app-vh',window.innerHeight+'px');
  setVH();
  window.addEventListener('resize',setVH);
  window.addEventListener('orientationchange',()=>setTimeout(setVH,200));
}
</script>
</body>
</html>
